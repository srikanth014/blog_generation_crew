blog_writing_task:
  description: >
    The task is to write a well researched blog on topic: {topic}.
    The blog should always contain:
    1. fun facts about the topic: {topic}.
    2. Emoji's whever applicable.
    3. Real life analogies wherever the need may be.
    4. fun and easy to understand writing style.

    THe blog should be fun to read by youungsters and increases the reader's count.

    The blog should be reviewd when written.


    Tasks to be done:
    1. Research on the topic: {topic}
    2. Write a blog on the topic: {topic}
    3. Review the blog at the end and giving feedback by a blog reviewwer

  expected_output: >
    The blog should be saved as a markdown fulke to given path. The blog should be well structured and be able to display the emoji's added inside the content of the blog_review_agent